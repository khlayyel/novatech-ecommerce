# Blueprint Render — déploiement du backend en un clic.
# Après le premier déploiement, renseignez les secrets (sync: false)
# dans le dashboard Render : MONGODB_URI, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, FRONTEND_URL.
services:
  - type: web
    name: novatech-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
