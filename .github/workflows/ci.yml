# ── CI : lint + tests backend + typecheck/build + tests frontend ──
# S'exécute à chaque push et pull request.

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Installation des dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests d'intégration (Jest + Supertest, MongoDB en mémoire)
        run: npm test

  frontend:
    name: Frontend (lint + typecheck + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Installation des dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build (typecheck TypeScript + build Vite)
        run: npm run build

      - name: Tests composants (Jest + React Testing Library)
        run: npm test

  docker:
    name: Docker (construction des images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image API
        run: docker build -f Dockerfile.backend -t novatech-api:ci .

      - name: Build image frontend
        run: >
          docker build -f Dockerfile.frontend -t novatech-web:ci
          --build-arg VITE_API_URL=http://localhost:5000/api
          --build-arg VITE_STRIPE_PUBLIC_KEY=pk_test_ci .
